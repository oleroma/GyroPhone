[package]
name = "gp-input"
version = "0.1.0"
edition = "2021"
description = "GyroPhone's PC input process: the phone link, the engine and the outputs."
publish = false

[lib]
name = "gp_input"
path = "src/lib.rs"

[[bin]]
name = "GyroPhoneInput"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "zeroize"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
getrandom = "0.2"
libm = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
socket2 = "0.5"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = 1

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_WindowsProgramming", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_LibraryLoader", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_Devices_Properties", "Win32_Graphics_Gdi", "Win32_Devices_Usb", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_System_Power"] }
# Typed COM, for the Network List Manager only (is the network marked Public).
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Networking_NetworkListManager", "Win32_System_Com"] }
