name: Fallback build

# Run by hand on a feature branch when Olex's PC can't be reached (AGENTS.md step 3):
#   gh workflow run fallback.yml --ref <branch>
# agent-merge runs it with -f mode=check to run the full checks on the branch before merging.
# It runs the quick tests and builds the APK (Linux) and the Windows companion (Windows),
# saving each build file on the run, unzipped.
# On a push to main (a feature merged after Olex's OK) it runs the full checks only and builds nothing.
# Both use the repo's hooks in .agents/hooks/, the same ones PC builds run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "build: quick tests and build files; check: the full checks only (agent-merge)"
        type: choice
        options: [build, check]
        default: build

permissions:
  contents: read
  statuses: write # check mode marks the commit checked, so agent-merge can skip a second run

# A newer push to main cancels the older check still running; runs started by hand are never cancelled.
concurrency:
  group: fallback-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Claims the build number both build jobs use, so the APK and the companion share one version.
  number:
    if: github.event_name != 'push' && inputs.mode != 'check'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the build/<n> tag
    outputs:
      n: ${{ steps.n.outputs.n }}
    steps:
      - uses: actions/checkout@v7
      - id: n
        run: n="$(bash .agents/build-number)" && echo "n=$n" >> "$GITHUB_OUTPUT"

  android:
    needs: number
    # Also runs when number is skipped (check mode, pushes to main).
    if: ${{ !cancelled() && needs.number.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          # The default also asks for the old "tools" package, which the SDK no longer has.
          packages: platform-tools
      # Branch runs save the cache too, so the next run on the branch reuses its work.
      # Runs on main only read it, so main doesn't fill the repo's cache space.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'push' }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: false

      - name: Quick tests
        if: github.event_name != 'push' && inputs.mode != 'check'
        run: bash .agents/hooks/quick-test

      - name: Build
        id: build
        if: github.event_name != 'push' && inputs.mode != 'check'
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
        run: |
          set -o pipefail
          bash .agents/hooks/build apk | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Full checks
        if: github.event_name == 'push' || inputs.mode == 'check'
        run: bash .agents/hooks/full-check

      - name: Mark the commit checked
        if: inputs.mode == 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=success -f context=full-check -f description="Passed in CI"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Saved on the run as the plain file, not a zip, so the download link gives the file itself.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push' && inputs.mode != 'check'
        with:
          path: ${{ steps.build.outputs.file }}
          archive: false

  companion:
    needs: number
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('companion/**/*.csproj', 'companion/Directory.Build.props') }}
          restore-keys: nuget-

      - name: Build
        id: build
        shell: bash
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
        run: |
          set -o pipefail
          bash .agents/hooks/build companion | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.file }}
          archive: false
