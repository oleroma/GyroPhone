name: Fallback build

# Run by hand on a feature branch when Olex's PC can't be reached (AGENTS.md step 3):
#   gh workflow run fallback.yml --ref <branch>
# It runs the quick tests and builds the APK (Linux) and the Windows companion (Windows),
# saving each build file on the run, unzipped.
# On a push to main (a feature merged after Olex's OK) it runs the full checks only and builds nothing.
# Both use the repo's hooks in .agents/hooks/, the same ones PC builds run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main cancels the older check still running; runs started by hand are never cancelled.
concurrency:
  group: fallback-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      # Full history: the version is the commit count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the old "tools" package, which the SDK no longer has.
          packages: platform-tools
      # Branch runs save the cache too, so the next run on the branch reuses its work.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: false

      - name: Quick tests
        if: github.event_name != 'push'
        run: bash .agents/hooks/quick-test

      - name: Build
        id: build
        if: github.event_name != 'push'
        run: |
          set -o pipefail
          bash .agents/hooks/build apk | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Full checks
        if: github.event_name == 'push'
        run: bash .agents/hooks/full-check

      # Saved on the run as the plain file, not a zip, so the download link gives the file itself.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push'
        with:
          path: ${{ steps.build.outputs.file }}
          archive: false

  companion:
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('companion/**/*.csproj', 'companion/Directory.Build.props') }}
          restore-keys: nuget-

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          bash .agents/hooks/build companion | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.file }}
          archive: false
