name: Fallback build

# The fallback for a PC build (AGENTS.md step 3), started by agent-build ci on a feature branch:
#   gh workflow run fallback.yml --ref <branch>
# It does what a PC build does, with the same hooks in .agents/hooks/: quick tests, build,
# full checks. When every job passes it marks the commit checked, as PC builds do.
# Each build is published as a pre-release on its build/<n> tag before the full checks, and
# agent-build takes its links and files from there. It never runs on a push.
# Every job has a timeout-minutes. Keep its actions on the Node 24 runtime.
# Only the parts the branch changed since main are tested and built (.agents/hooks/parts):
# the APK with the Kotlin core's tests on Linux, the companion with its tests on Windows, the
# only place all companion projects run. Both share one build number.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Claims the build number both build jobs use, so the APK and the companion share one version,
  # and finds the parts the branch changed.
  number:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the build/<n> tag
    outputs:
      n: ${{ steps.n.outputs.n }}
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # parts compares the branch with main
      - id: parts
        run: echo "parts=$(bash .agents/hooks/parts | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - id: n
        run: n="$(bash .agents/build-number)" && echo "n=$n" >> "$GITHUB_OUTPUT"

  android:
    needs: number
    if: contains(needs.number.outputs.parts, 'apk')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the pre-release for Obtainium
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          # The default also asks for the old "tools" package, which the SDK no longer has.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # Gradle's build cache, saved by every run so the next build on this branch, or a new
      # branch's first build, reuses the newest outputs. The basic cache above is keyed by the
      # build files, so it's saved once and then only restored, and its build cache goes stale.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.run_id }}
          restore-keys: gradle-build-cache-

      - name: Quick tests
        run: bash .agents/hooks/quick-test apk

      - name: Build
        id: build
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
        run: |
          set -o pipefail
          bash .agents/hooks/build apk | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\r' <"$RUNNER_TEMP/build.out" | sed -n 's/^build-file: [^ ]* \([^ ]*\)$/\1/p' | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      # Pre-release for Obtainium on the phone, so a CI build installs without the PC. It's
      # published before the full checks so the phone gets it sooner, as a PC build installs
      # first; only the checked job marks the commit checked for agent-merge.
      - name: Publish for Obtainium
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build/${{ needs.number.outputs.n }}
          FILE: ${{ steps.build.outputs.file }}
          VERSION: ${{ steps.build.outputs.version }}
        # The companion job may have made the release first; then the APK is added to it.
        run: >-
          gh release create "$TAG" "$FILE" --verify-tag --prerelease
          --title "$VERSION" --notes "CI fallback build of $GITHUB_REF_NAME ($GITHUB_SHA)"
          || gh release upload "$TAG" "$FILE"

      - name: Full checks
        run: bash .agents/hooks/full-check apk

  companion:
    needs: number
    if: contains(needs.number.outputs.parts, 'companion')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # the pre-release
    outputs:
      version: ${{ steps.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('companion/**/*.csproj', 'companion/Directory.Build.props') }}
          restore-keys: nuget-

      - name: Quick tests
        run: bash .agents/hooks/quick-test companion

      - name: Build
        id: build
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
        run: |
          set -o pipefail
          bash .agents/hooks/build companion | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\r' <"$RUNNER_TEMP/build.out" | sed -n 's/^build-file: [^ ]* \([^ ]*\)$/\1/p' | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      # On the same pre-release as the APK, so agent-build pc can download and install it.
      # The android job may have made the release first; then the companion is added to it.
      - name: Publish the companion
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build/${{ needs.number.outputs.n }}
          FILE: ${{ steps.build.outputs.file }}
          VERSION: ${{ steps.build.outputs.version }}
        run: >-
          gh release create "$TAG" "$FILE" --verify-tag --prerelease
          --title "$VERSION" --notes "CI fallback build of $GITHUB_REF_NAME ($GITHUB_SHA)"
          || gh release upload "$TAG" "$FILE"

  # Runs only when every build job that ran passed (a part the branch didn't change is skipped).
  checked:
    needs: [number, android, companion]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # agent-build pc reuses this build's pre-release when this status says it passed in CI.
      - name: Mark the commit checked
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version || needs.companion.outputs.version }}
        run: >-
          test -n "$VERSION" &&
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=success -f context=full-check -f description="Passed in CI: version $VERSION"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
