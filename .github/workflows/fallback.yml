name: Fallback build

# Builds run on the dev PC. Run this by hand only when the PC is offline:
#   gh workflow run fallback.yml --ref <branch>
# It runs the tests and saves the debug APK and the Windows companion on the run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallback
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        run: |
          echo "GP_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "GP_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test
      - name: Companion tests (Linux)
        run: dotnet test companion/GyroPhone.Companion.Linux.slnf -c Release

      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "gyrophone-0.1.$GP_BUILD-$GP_COMMIT-$GP_BUILD.apk"
          echo "gyrophone-0.1.$GP_BUILD-$GP_COMMIT-$GP_BUILD.apk  SHA-256 \`$(sha256sum "gyrophone-0.1.$GP_BUILD-$GP_COMMIT-$GP_BUILD.apk" | cut -d" " -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      # Saved on the run as the plain .apk, not a zip, so it installs straight from the download.
      - uses: actions/upload-artifact@v7
        with:
          path: gyrophone-*.apk
          archive: false

  companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        shell: bash
        run: |
          echo "GP_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "GP_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test companion/GyroPhone.Companion.sln -c Release

      - name: Build
        shell: bash
        run: >
          dotnet publish companion/src/GyroPhone.Tray -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none
          -p:Version=0.1.$GP_BUILD -p:InformationalVersion=0.1.$GP_BUILD-$GP_COMMIT
          -p:IncludeSourceRevisionInInformationalVersion=false -o out

      - uses: actions/upload-artifact@v4
        with:
          name: gyrophone-companion-win-x64
          path: out
