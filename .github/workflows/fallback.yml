name: Fallback build

# The fallback for a PC build (AGENTS.md step 3), started by agent-build ci on a feature branch:
#   gh workflow run fallback.yml --ref <branch>
# It does what a PC build does, with the same hooks in .agents/hooks/: quick tests, build,
# full checks. When every job passes it marks the commit checked, as PC builds do.
# Each build file is saved on the run unzipped. It never runs on a push.
# The quick tests run on Windows, the only place all of them (the Kotlin core and every
# companion project) can run. The APK builds on Linux and the companion on Windows; both
# share one build number.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Claims the build number both build jobs use, so the APK and the companion share one version.
  number:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the build/<n> tag
    outputs:
      n: ${{ steps.n.outputs.n }}
    steps:
      - uses: actions/checkout@v7
      - id: n
        run: n="$(bash .agents/build-number)" && echo "n=$n" >> "$GITHUB_OUTPUT"

  android:
    needs: number
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          # The default also asks for the old "tools" package, which the SDK no longer has.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        id: build
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
        run: |
          set -o pipefail
          bash .agents/hooks/build apk | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\r' <"$RUNNER_TEMP/build.out" | sed -n 's/^build-file: [^ ]* \([^ ]*\)$/\1/p' | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      # Saved on the run as the plain file, not a zip, so the download link gives the file itself.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.file }}
          archive: false

      - name: Full checks
        run: bash .agents/hooks/full-check

  companion:
    needs: number
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('companion/**/*.csproj', 'companion/Directory.Build.props') }}
          restore-keys: nuget-

      - name: Quick tests
        run: bash .agents/hooks/quick-test

      - name: Build
        id: build
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
        run: |
          set -o pipefail
          bash .agents/hooks/build companion | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\r' <"$RUNNER_TEMP/build.out" | sed -n 's/^build-file: [^ ]* \([^ ]*\)$/\1/p' | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.file }}
          archive: false

  # Runs only when both build jobs passed.
  checked:
    needs: [android, companion]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # agent-build pc reads the version from this status when it reuses this build.
      - name: Mark the commit checked
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version }}
        run: >-
          test -n "$VERSION" &&
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=success -f context=full-check -f description="Passed in CI: version $VERSION"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
