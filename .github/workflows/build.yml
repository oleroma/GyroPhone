name: Checks

# Tests only. The APK and the companion exe are built on the dev PC (update.cmd), never in CI.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Companion tests (Linux)
        run: dotnet test companion/GyroPhone.Companion.Linux.slnf -c Release

  companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test companion/GyroPhone.Companion.sln -c Release
