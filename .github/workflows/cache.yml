name: Main cache

# Keeps main's build caches warm, so the fallback build (fallback.yml) on a new branch starts
# from them: GitHub lets a branch read only its own caches and main's. Runs after each push to
# main and only compiles or restores the parts the push changed (.agents/hooks/parts), with the
# same cache setup as fallback.yml. It runs no tests or checks, sets no status, and nothing
# waits for it.
# The one exception: agent-build ci waits up to 30 minutes for a running one. Every job has a timeout-minutes.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: main-cache
  cancel-in-progress: true

jobs:
  parts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: parts
        env:
          BEFORE: ${{ github.event.before }}
        run: echo "parts=$(bash .agents/hooks/parts "$BEFORE" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

  # The Gradle cache: what the apk part's quick-test and build hooks compile, without running
  # the tests.
  android:
    needs: parts
    if: contains(needs.parts.outputs.parts, 'apk')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      # Gradle's build cache, saved by every run so the next build on this branch, or a new
      # branch's first build, reuses the newest outputs. The basic cache above is keyed by the
      # build files, so it's saved once and then only restored, and its build cache goes stale.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.run_id }}
          restore-keys: gradle-build-cache-
      - run: ./gradlew :app:assembleRelease :core:testClasses

  # The NuGet cache, the only one the companion job keeps: restoring the packages fills it.
  companion:
    needs: parts
    if: contains(needs.parts.outputs.parts, 'companion')
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('companion/**/*.csproj', 'companion/Directory.Build.props') }}
          restore-keys: nuget-
      - run: dotnet restore companion/GyroPhone.Companion.sln
      # The build hook publishes the tray app for win-x64 ReadyToRun, which needs that runtime's
      # packages and the ReadyToRun compiler (crossgen2) package.
      - run: dotnet restore companion/src/GyroPhone.Tray -r win-x64 -p:PublishReadyToRun=true
