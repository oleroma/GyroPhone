<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><script src="lib.js"></script>
<style>
/* DevicePresetsScreen.kt: preset tabs, the board (DeviceControls.kt ControlFace), DeviceSwitch at the bottom. */
.ptab{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--m3-outline-variant);display:flex;align-items:center;font-size:14px;font-weight:500;flex:none}
.ptab.on{background:var(--m3-secondary-container);border-color:var(--m3-secondary);color:var(--m3-on-secondary-container)}
.board{position:absolute;left:0;right:0;top:53px;bottom:53px}
.hand{position:absolute;top:58px;width:200px;height:230px;border-radius:40px 40px 70px 70px;background:#26232B;border:1px solid #49454F}
.ph{position:absolute;left:290px;top:58px;width:320px;height:180px;border-radius:18px;background:#0e0f12;border:1px solid #49454F}
.c{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#36343B;border:1px solid #938F99;color:#CAC4D0;font-size:13px;font-weight:600;line-height:14px;border-radius:6px}
.c.r{border-radius:50%}
.c.w{flex-direction:row;gap:6px}
.c.m{background:#4F378B;border-color:#D0BCFF;color:#EADDFF}
.c .n{font-size:11px;font-weight:700;white-space:nowrap}
.c.sel{border:2.5px solid #E6E0E9;transform:scale(1.1);box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.c.tgt{border:3px solid #EFB8C8;transform:scale(1.1)}
.bbar{position:absolute;left:0;right:0;bottom:0;height:52px;border-top:1px solid var(--m3-outline-variant);display:flex;align-items:center;padding:0 8px;gap:4px}
.dsw{display:flex;border:1px solid var(--m3-outline);border-radius:20px;overflow:hidden}
.dsw span{padding:7px 14px;font-size:14px;font-weight:500;color:var(--m3-on-variant)}
.dsw span.on{background:var(--m3-secondary-container);color:var(--m3-on-secondary-container)}
.pop{position:absolute;background:#2B2930;border-radius:10px;padding:8px 12px;font-size:12px;line-height:17px;color:#E6E0E9;box-shadow:0 4px 12px rgba(0,0,0,.5);white-space:nowrap}
.pop{background:#2B2930;border-radius:12px;padding:8px 12px;font-size:14px;line-height:20px}.pop .w{display:inline-block;width:78px;font-size:12px;color:#CAC4D0}
</style></head><body>
<div class="stage pad-callouts" id="st"></div>
<script>
const st = document.getElementById('st');
const s = phone(st, 'land');
const p = el(s, `<div class="page" style="padding-left:34px">
 <div class="pbar"><span class="tb">← Pad</span><span class="ptab">None</span><span class="ptab on">Controller</span><span class="ptab">Shooter</span><span class="tb">+ Preset</span></div>
 <div class="board"></div>
 <div class="bbar"><div class="dsw"><span>🎮 Controller</span><span>⌨ Keyboard</span><span class="on">🖱 Mouse</span><span>📱 Phone</span></div>
  <span class="tb" style="color:var(--m3-primary);font-weight:500;padding:0 12px">⌨ Press a button</span>
  <span style="flex:1"></span><span style="font-size:11px;color:var(--m3-on-variant)">Tap: what it does · Hold: edit · Hold and drag: swap</span></div>
</div>`);
const b = p.querySelector('.board');
// MouseView: PhysicalLayouts.mouseControls on a mouse body (aspect 0.8) as tall as the board allows.
const BW = 866, BH = 306, mh = Math.min(BH, BW / 0.8), mw = mh * 0.8;
const mb = el(b, `<div style="position:absolute;left:${(BW - mw) / 2}px;top:${(BH - mh) / 2}px;width:${mw}px;height:${mh}px"></div>`);
el(mb, `<svg width="${mw}" height="${mh}" style="position:absolute;inset:0"><rect x="${mw * .15}" y="${mh * .02}" width="${mw * .7}" height="${mh * .96}" rx="${mw * .35}" fill="#211F26" stroke="#49454F" stroke-width="1.5"/><line x1="${mw / 2}" y1="${mh * .02}" x2="${mw / 2}" y2="${mh * .35}" stroke="#49454F" stroke-width="1.5"/></svg>`);
const MC = [['left','Left',.31,.2,.27,.3,1],['right','Right',.69,.2,.27,.3,0],['wheel','Wheel',.5,.2,.09,.22,0],['forward','5',.13,.47,.07,.11,0],['back','4',.13,.6,.07,.11,0],['move','Move',.5,.66,.3,.24,2]];
for (const [id, l, x, y, w, h, n] of MC) {
  const kk = el(mb, `<div class="c${n ? ' m' : ''}" data-id="${id}" style="left:${mw * (x - w / 2)}px;top:${mh * (y - h / 2)}px;width:${mw * w}px;height:${mh * h}px"><span class="in" style="display:flex;flex-direction:column;align-items:center">${l}${n ? `<span class="n">↪ ${n}</span>` : ''}</span></div>`);
  const inn = kk.querySelector('.in'); const sc = Math.min(1, kk.clientWidth * .86 / inn.offsetWidth, kk.clientHeight * .86 / inn.offsetHeight); inn.style.transform = `scale(${sc})`; }
marks(st, [[1, mb.querySelector('[data-id="wheel"]'), 't'], [2, mb.querySelector('[data-id="back"]'), 'l', { dx: -3 }], [3, mb.querySelector('[data-id="move"]'), 'r', { shift: 0 }]]);
</script></body></html>
