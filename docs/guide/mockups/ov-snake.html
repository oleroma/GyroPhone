<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><script src="lib.js"></script><script src="pcwin.js"></script><script src="ovlib.js"></script></head><body>
<div class="stage pad-callouts" id="st"></div>
<script>
const st = document.getElementById('st');
const { tog, seg, chips, sl, sls, t, sub, hint, div, btn, pick, card, swatches } = ov, ind = ov.in;
const T = s => w.querySelector(s + ' .tl') || w.querySelector(s);
// Snake tab of a Pointer overlay with the Snake on (its look follows the paint's until you change it).
const w = ovCol(st, 'Pointer', ['Window', 'Look', 'Paint', 'Snake', 'Colours', 'Turning'], 'Snake',
  card('Snake', tog('Snake', 'A line following the beam along the newest stretch of its path, thinning and fading toward its tail as set. With or without Draw mode.', 1, 'snake')
    + ind(sl('Length', .5, '180°', 'len') + sl('Snake brush', 3 / 19, '4°') + sl('Taper', .8, '80%') + sl('Tail fade', .5, '50%') + sl('Snake glow', 0, '0%')
      + tog('Clear on ratchet', 'A ratchet press clears the Snake.', 0, 'clr')
      + hint('Snake brush: how wide its head is. Taper: how much it thins toward its tail (0 keeps it the same width). Tail fade: how see-through it gets toward its tail (0 none). Snake glow: a soft glow round it (0 none).'))
    + sub('Zip back') + tog('Continuous', 'The tail always runs toward the head, while the beam moves and while it holds still: moving faster than the zip speed, the Snake grows (up to its Length); slower, it shrinks.', 0, 'cont')
    + tog('On ratchet', 'A ratchet press runs the tail back into the head, the whole Snake in the time below, however long it is. Clear on ratchet, when on, wins.', 1, 'zr')
    + ind(sl('Zip back in', .35 / 1.95, '0.40 s'))
    + hint('Both can be on. Zipped all the way, the Snake stays as a dot the size of its head; it grows again as the beam moves on.')
    + sub('Shots and aiming') + sl('Fire brush', 5 / 19, '6°', 'sfb') + sl('Aim brush', 2 / 19, '3°') + hint('How wide the Snake is while firing (in the Fire colours) and aiming (in the Aim colours).')
    + sub('Colour by') + chips(['Where it is', 'The way it moved'], 0, 'by') + sl('Facing shade', 0.5, '50%', 'sshade') + sl('Inside', 0.625, '70%') + hint("Facing shade darkens it where the sphere's surface turns away from you, so you see its roundness (0 off). Inside: how bright the far half is, seen from inside the sphere, next to the near half seen from outside.") + sub('Light') + sl('Light strength', 0.5, '50%') + chips(['Upper left', 'Above', 'Upper right', 'Front'], 0, 'sfrom') + sl('Shine', 0.3, '30%') + hint('A light fixed in the scene, shining from where you pick: it stays put while the sphere or the pointer turns. Light strength darkens what faces away from it (0 off); Shine adds a glossy highlight where it reflects toward you (0 none).')
    + hint('The Snake\'s own look: Draw mode\'s paint has its own in the Paint tab.')), 760);
marks(st, [[1, T('#snake'), 'r'], [2, w.querySelector('#len .v'), 'r'], [3, T('#cont'), 'r'], [4, T('#zr'), 'r'], [5, w.querySelector('#sfb .v'), 'r'], [6, w.querySelector('#by'), 'r'], [7, w.querySelector('#sfrom'), 'r']]);
</script></body></html>
