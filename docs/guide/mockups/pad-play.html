<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><script src="lib.js"></script></head><body>
<div class="stage pad-callouts" id="st"></div>
<script>
const st = document.getElementById('st');
const s = phone(st, 'land');
// The fresh install's WASD workspace (BuiltinProfiles.kt), with LMB held: it lights and, with Show mappings on
// buttons (on by default), shows what it sends in its middle in place of its label (ValueBars.kt).
drawControls(s, LAYOUTS.wasd, 900, 412, { state: { lmb: 'pressed' }, labels: { lmb: '<span class="vframe">Mouse L</span>' } });
drawControls(s, LAYOUTS.nav, 900, 412);
// CapsuleRow.kt over the pad's top edge, clear of the camera cutout.
const row = capsules(s, [['+', 'ws'], ['Controller', 'ws'], ['WASD ✎', 'wsOn'], ['Keyboard', 'ws'], ['WASD', 'devices'], ['App', 'app'], ['Defaults', 'defaults'], ['Connection', 'conn']], { left: 58, top: 8 });
row.style.gap = '4px'; for (const k of row.children) k.style.padding = '0 13px';
// Still too wide? Shrink the row as a whole so it ends 8 px before →, every capsule whole.
{ const n = boxOf(st, ctl(s, 'nav_next')), r = boxOf(st, row), k = Math.min(1, (n.x - 8 - r.x) / r.w);
  row.style.transformOrigin = 'left top'; row.style.transform = 'scale(' + k + ')'; }
const c = row.children;
const pad = boxOf(st, s);
const touch = { x: pad.x + 440, y: pad.y + 230, w: 0, h: 0 };
marks(st, [
  [1, c[0], 't'], [2, c[1], 't'], [3, c[2], 't'], [4, c[4], 't'], [5, c[5], 't'], [6, c[6], 't'], [7, c[7], 't'],
  [8, ctl(s, 'nav_prev'), 'l'], [9, ctl(s, 'nav_next'), 'r'],
  [10, touch, 'b', { at: 'c' }], [11, ctl(s, 'lmb'), 'r'], [12, ctl(s, 'move'), 'b'],
]);
</script></body></html>
