<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><script src="lib.js"></script></head><body>
<div class="stage pad-callouts" id="st"></div>
<script>
const st = document.getElementById('st');
const s = phone(st, 'land');
// Edit mode: every control at least 50 % opaque, the selected one amber (PadScreen.kt SELECTED_COLOR).
drawControls(s, LAYOUTS.wasd, 900, 412, { state: { lmb: 'selected' } });
drawControls(s, LAYOUTS.nav, 900, 412);
// The floating menu: TopCenter of the pad, 8 dp in, at most the pad's width less 16 dp; one row in landscape.
// ⠿ | ↶ ↷ | strip (⚙ lock Done Cancel Select Configure Map Add + Add preset ★ Snap Devices), the strip scrolls.
const m = el(s, `<div class="menu" style="left:50%;transform:translateX(-50%);top:8px;max-width:884px">
  <div class="row"><div class="dots">⠿</div><div class="fix"><span class="ic">${ICON.undo}</span><span class="ic">${ICON.redo}</span></div>
  <div class="strip" style="flex:1;min-width:0"><span class="ic">${ICON.tune}</span><span class="ic">${ICON.lockOpen}</span>
  <span class="b fill">Done</span><span class="b">Cancel</span><span class="b">Select</span><span class="b amber">Configure</span><span class="b amber">Map</span>
  <span class="b">Add +</span><span class="b">Add preset ★</span><span class="b fill">Snap: on</span><span class="b">Devices: WASD</span><div class="shade"></div></div></div>
  <div class="grip"></div></div>`);
m.querySelector('.ic svg').style.color = '#fff';
// What the strip can't show is scrolled off (never cut in half here, so every word reads).
const strip = m.querySelector('.strip'), lim = strip.getBoundingClientRect().right - 40;
strip.querySelectorAll('.b').forEach(b => { if (b.getBoundingClientRect().right > lim) b.style.visibility = 'hidden'; });
const q = sel => m.querySelectorAll(sel), b = q('.b');
marks(st, [
  [1, m.querySelector('.dots'), 't'], [2, q('.fix .ic')[0], 't', { dx: 14 }],
  [3, q('.strip .ic')[0], 't'], [4, q('.strip .ic')[1], 't'], [5, b[0], 't'],
  [6, b[2], 't'], [7, b[3], 't'], [8, b[4], 't'], [9, b[5], 't'],
  [10, m.querySelector('.shade'), 't'],
  [11, ctl(s, 'lmb'), 'r'], [12, m.querySelector('.grip'), 'r'],
]);
</script></body></html>
