for (let i = 0; i < 7; i++) badge(st, i + 1, nav[i], 'l', -2);
badge(st, 8, cards[0], 'tr', 0);
badge(st, 9, cards[1], 'tr', 0);
badge(st, 10, w.querySelector('.wseg'), 'r', 6);
badge(st, 11, w.querySelector('.wtog i'), 'l', 4);
