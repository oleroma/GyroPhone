<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><script src="lib.js"></script></head><body>
<div class="stage pad-callouts" id="st"></div>
<script>
const st = document.getElementById('st');
const s = phone(st, 'land');
// ControlMappingScreen.kt in landscape: one thin top row on its own background (label, layer chips, Sort, Reset all,
// Clear all, + Preset, Settings, Undo, Redo, Done), then the action cards and the library side by side with a
// SplitHandle (20 dp, a 4 x 40 dp grip) between them, split half and half by default.
const p = el(s, `<div class="page" style="padding-left:34px;display:flex;flex-direction:column">
 <div class="mtop" style="background:#211F26"><span class="lbl">LMB</span><span class="setchip on">Base</span><span class="tb">+ Layer</span><span class="tb">Sort ▾</span><span class="tb">↺ Reset all</span><span class="tb">✕ Clear all</span><span class="tb">+ ◯ Preset</span><span class="tb">⚙ Settings</span><span class="tb">↶ Undo</span><span class="tb">↷ Redo</span><span class="done">Done</span></div>
 <div style="flex:1;display:flex;min-height:0">
  <div style="flex:1;padding:8px 12px 0;overflow:hidden">
   <div style="display:flex;gap:6px;margin-bottom:8px;white-space:nowrap"><span class="setchip on">✓ 1 finger</span><span class="setchip">2 fingers</span><span class="setchip">3 fingers</span><span class="setchip">4 fingers</span><span class="setchip">Gyro</span></div>
   <div class="acard sel"><div class="hd"><span class="t">Touch</span><span class="buzz">Buzz</span><span class="h">⠿</span></div>
    <div class="crow"><span class="mchip">Mouse L</span><span class="mchip"><small>Long press ·</small> Key R</span></div>
    <div class="timing">Long press: from 300 ms</div></div>
   <div class="acard"><div class="hd"><span class="g">⚙</span><span class="t">Move</span><span class="h">✕</span><span class="h">⠿</span></div>
    <div class="crow"><span class="mchip inh">Mouse X <small>Workspace</small></span><span class="mchip inh">Mouse Y <small>Workspace</small></span></div></div>
  </div>
  <div class="vsplit" style="width:20px;background:#211F26;display:flex;align-items:center;justify-content:center"><div style="width:4px;height:40px;border-radius:2px;background:var(--m3-outline)"></div></div>
  <div style="flex:1;background:#1D1B20;padding-top:8px;overflow:hidden">
   <div class="search" style="margin:0 12px;height:36px;background:#2B2930"><span>⌕</span><span>Search, e.g. W, LT, wheel</span></div>
   <div class="lrow" style="display:flex;gap:6px;padding:6px 12px;white-space:nowrap;overflow:hidden"><span class="setchip">⌨ Press a key</span><span class="setchip">Recent</span><span class="setchip">Presets</span><span class="setchip on">✓ Keyboard</span><span class="setchip">Mouse</span><span class="setchip">Gamepad</span><span class="setchip">Gyro</span></div>
   <div style="font-size:12px;color:var(--m3-on-variant);padding:0 16px">Tap to add to Touch · long-press to drag</div>
   <div style="padding:10px 12px"><span class="lchip">Esc</span><span class="lchip">Tab</span><span class="lchip">Space</span><span class="lchip">Shift</span><span class="lchip">Ctrl</span><span class="lchip">Alt</span><span class="lchip mapped">R</span><span class="lchip">E</span><span class="lchip">F</span><span class="lchip">Q</span><span class="lchip">W</span><span class="lchip">A</span><span class="lchip">S</span><span class="lchip">D</span><span class="lchip">1</span><span class="lchip">2</span><span class="lchip">3</span><span class="lchip">4</span></div>
  </div>
 </div></div>`);
const q = (sel, i = 0) => p.querySelectorAll(sel)[i];
// Library tabs past the edge are scrolled off (none cut in half, so every word reads).
{ const r = q('.lrow'), lim = r.getBoundingClientRect().right - 8;
  r.querySelectorAll('.setchip').forEach(c => { if (c.getBoundingClientRect().right > lim) c.style.visibility = 'hidden'; }); }
const B = e => boxOf(st, e), pk = B(q('.lrow .setchip', 0)), H = st.offsetHeight;
const chip6 = B(q('.mchip', 1)), t1 = B(q('.setchip', 2)), t2 = B(q('.setchip', 3)), gx = (t1.x + t1.w + t2.x) / 2 + 2;
marks(st, [
  [1, q('.lbl'), 't'], [2, q('.setchip'), 't'], [3, q('.mtop .tb', 5), 't'], [4, q('.done'), 't'],
  [5, q('.acard'), 'l'],
  [6, q('.mchip', 1), 't', { dx: gx - (chip6.x + chip6.w / 2) }],
  [7, q('.buzz'), 'b'], [8, q('.mchip.inh', 1), 'b'],
  [9, q('.vsplit'), 'b', { at: 'c', dy: 60, shift: -10 }],
  [10, q('.lrow .setchip', 3), 't'],
  [11, q('.lrow .setchip', 0), 'b', { dx: -pk.w / 2, dy: -pk.h / 2, shift: 40, via: [[pk.x - 7, pk.y + pk.h / 2], [pk.x - 7, H - 62]] }],
], {});
</script></body></html>
